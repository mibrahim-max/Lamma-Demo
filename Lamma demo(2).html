<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamma demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#E9E6E0; --bg:#FFFFFF; --surface:#F6F4F0; --ink:#16161D; --muted:#5C5A55; --line:#E4E2DD;
  --panel:#16161D; --panel-ink:#FFFFFF; --panel-muted:#C9C7C1; --panel-2:#2B2B35;
  --accent:#D1403A; --accent-text:#B23A33; --accent-soft:#FFE8E3; --accent-light:#FF8A70;
  --teal:#7B3FB8; --accent-grad:linear-gradient(120deg,#D1403A 0%,#C9366E 60%,#8A3FD1 100%); --teal-soft:#F2EAFB; --teal-text:#5B2DA8;
  --display:'Bricolage Grotesque', Georgia, 'Times New Roman', serif;
  --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0D0D11; --bg:#16161C; --surface:#1F1F27; --ink:#F3F2EF; --muted:#AAA8A2; --line:#30303A;
    --panel:#26262F; --panel-2:#363641; --accent-text:#FF8A70; --accent-soft:#3D1F22;
    --teal-soft:#2A1E3B; --teal-text:#CDB4F5;
  }
}
:root[data-theme="dark"]{
  --page:#0D0D11; --bg:#16161C; --surface:#1F1F27; --ink:#F3F2EF; --muted:#AAA8A2; --line:#30303A;
  --panel:#26262F; --panel-2:#363641; --accent-text:#FF8A70; --accent-soft:#3D1F22;
  --teal-soft:#2A1E3B; --teal-text:#CDB4F5;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;background:var(--page);font-family:var(--body);color:var(--ink);display:flex;justify-content:center;align-items:center}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-light);outline-offset:2px}
.app{position:relative;width:100%;max-width:430px;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){.app{height:min(880px,calc(100% - 48px));border-radius:36px;box-shadow:0 24px 60px rgba(22,22,29,.18)}}
.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px;font-size:12px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--line)}
.demo-bar button{border:none;background:none;color:var(--accent-text);font-weight:700;font-size:12px;min-height:32px;padding:0 4px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.foot{padding:12px 20px 20px;display:flex;flex-direction:column;gap:8px}
.topbar{display:flex;align-items:center;gap:4px;padding:12px 12px 4px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:inherit;flex-shrink:0}
.h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15;margin:0}
.wordmark{font-family:var(--display);font-weight:800;font-size:26px}
.sub{font-size:14px;color:var(--muted)}
.pad{padding:0 20px}
.btn{min-height:52px;border-radius:26px;border:none;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;width:100%}
.btn-accent{background:var(--accent-grad);color:#FFFFFF}
.grad-text{background:linear-gradient(90deg,#FF7A59 0%,#F0567A 55%,#C25BD6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-line{background:transparent;border:1px solid var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500}
.pill.on{background:var(--accent);border-color:var(--accent);color:#FFFFFF;font-weight:700}
.pill.on.teal{background:var(--teal);border-color:var(--teal)}
.card{border-radius:20px;background:var(--bg);border:1px solid var(--line);padding:14px 16px}
.avatar{width:32px;height:32px;border-radius:16px;font-size:12px;font-weight:700;color:#16161D;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tag{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.step{display:flex;align-items:center;gap:12px;font-size:15px}
.dot{width:24px;height:24px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.dot.done{background:var(--teal)}
.dot.now{border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
.dot.wait{border:2px solid var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sbar{from{width:0}to{width:100%}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s ease-out both}
@media (prefers-reduced-motion: reduce){.dot.now{animation:none}.rise{animation:none}.toast{transition:none}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal button{height:44px;border-radius:12px;border:none;font-size:14px}
.sr{position:absolute;left:-9999px}
input[type=range]{width:100%;accent-color:var(--accent-light)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:24px}
#invDialog > *, [role=dialog] > *{flex-shrink:0}
[hidden]{display:none !important}
.seg button{min-height:40px;border-radius:20px;border:none;background:transparent;font-size:14px}
</style>
</head>

const STEP_TEXT = () => {
  const r = S.request.toLowerCase();
  const outdoor = /hike|outdoor|park|trail/.test(r);
  return [
    `Checked ${C().prefsIn} members' preferences`,
    `Planning to everyone's budget`,
    outdoor ? 'Finding trails and parks nearby' : 'Finding spots with halal options',
    `Checking ${C().look.transit?'transit':'drive'} times from ${new Set(attendees().map(m=>m.area)).size} areas`,
    'Ranking the best 3'
  ];
};

function planning(){
  const steps = STEP_TEXT();
  const tags = requestTags();
  const ready = !!S.plans;
  return `<div class="screen">
  <div class="topbar"><button class="icon-btn" data-act="cancelPlan" aria-label="Cancel planning">${ICON.close}</button><span class="sub">Planning for ${esc(CM().name)}</span></div>

function mapSvg(pins, h){
  const spots = [[160,62],[200,48],[132,90]];
  return `<div style="margin:16px 20px 0;border-radius:18px;overflow:hidden">
  <svg viewBox="0 0 342 ${h}" width="100%" height="${h}" style="display:block" role="img" aria-label="Map with members' approximate areas and venues found">
    <rect width="342" height="${h}" fill="#ECE9E2"/>
    <path d="M0 ${h-46} C50 ${h-56} 84 ${h-32} 130 ${h-38} C176 ${h-44} 196 ${h-20} 214 ${h} L0 ${h} Z" fill="#C4DCE2"/>
    <rect x="246" y="14" width="66" height="36" rx="6" fill="#D6E6D0"/>
    <path d="M0 44 H342 M0 80 H342 M66 0 V${h} M160 0 V${h} M262 0 V${h} M0 10 L342 ${h-10}" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    ${[[38,24],[104,36],[228,104],[300,118]].map(([x,y])=>`<circle cx="${x}" cy="${Math.min(y,h-20)}" r="21" fill="#7B3FB8" opacity=".16"/>`).join('')}
    ${spots.slice(0,pins).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="#D1403A" stroke="#FFFFFF" stroke-width="2.5"/>`).join('')}
  </svg></div>`;
}

function requestTags(){
  const r = S.request;
  const tags = [CM().name, dateLabel(C().date)];
  const m = r.match(/\$\s?(\d+)/);
  tags.push(m ? `Under $${m[1]}` : 'Within everyone\'s budget');
  if(/hike|outdoor|park|trail/i.test(r)) tags.push('Outdoors');
  else if(/dinner|food|eat|brunch|lunch/i.test(r)) tags.push('Food first');
  else tags.push('Dinner + activity');
  tags.push('Greater Seattle');
  return tags;
}

const FRIEND_REPLIES = ["I'm in", 'Sounds good to me', 'What time are we thinking?', 'Can we keep it on the cheaper side?', 'Yes please', "Down. I'll bring snacks", 'Works for me', 'Love this idea'];
function friendReply(st, cm){
  const others = cm.members.filter(m=>m.id!=='mi');
  const p = others[Math.floor(Math.random()*others.length)];
  const typing = {from:'typing', who:p.id}; st.chat.push(typing); if(S.screen==='chat') render();
  later(()=>{ const i = st.chat.indexOf(typing); if(i>=0) st.chat.splice(i,1);
    st.chat.push({from:p.id, text:FRIEND_REPLIES[Math.floor(Math.random()*FRIEND_REPLIES.length)]});
    if(S.screen==='chat') render(); else st.unread++; }, 1400);
}
const PLAN_WORDS = /plan|dinner|lunch|brunch|eat|food|hike|bowl|karaoke|movie|game|night|weekend|saturday|sunday|friday|ideas?|something|outing|trip|activity|\$/i;
async function plannerReply(st, cm, text){
  const ask = text.replace(/^@planner\s*/i,'').trim();
  const thinking = {from:'planner', text:'Thinking…'}; st.chat.push(thinking); render();
  let reply = null, req = null;
  if(sampleFn){
    const recent = st.chat.filter(m=>m.text && m.from!=='system' && m!==thinking).slice(-8).map(m=>`${m.from==='mi'?'Mo':m.from==='planner'?'Planner':(cm.members.find(x=>x.id===m.from)||{}).name}: ${m.text}`).join('\n');
    const prompt = `You are "Planner", the AI inside a group chat for a friend group called ${JSON.stringify(cm.name)} in Greater Seattle. Be brief, warm and practical (max 2 short sentences, no emojis).
Group facts: they call each other ${JSON.stringify(cm.look.nickname||'friends')} (use it now and then), vibe ${JSON.stringify(cm.look.vibes)}, favorite areas ${JSON.stringify(cm.look.bases)}${cm.look.transit?', mostly takes transit':''}, ${cm.members.length} members, leading date ${dateLabel(st.date)}, ${st.prefsIn} of ${cm.members.length} have shared preferences. Popular picks: ${JSON.stringify(groupSummary().flatMap(p=>[...p.food.slice(0,2),...p.activities.slice(0,2)]).slice(0,16))}. Never reveal anyone's budget.
Recent chat:
${recent}

Mo just asked you: ${JSON.stringify(ask || text)}

If Mo wants a plan or ideas for an outing, set "planRequest" to a short request the planning engine can use (like "Bowling and tacos Saturday under $30"); otherwise null. Do not invent real business names.
Return only JSON: {"reply":"...","planRequest":"..." or null}`;
    try{
      const data = await sampleFn.json(prompt, {modelTier:'quick', cache:false});
      if(data && typeof data.reply==='string') { reply = data.reply.slice(0,400); req = typeof data.planRequest==='string' && data.planRequest.trim() ? data.planRequest.slice(0,120) : null; }
    }catch(e){ reply = null; }
  }
  if(!reply){
    if(PLAN_WORDS.test(ask)){ reply = `I can plan that for ${cm.name} using everyone's preferences. Tap below and I'll put together 3 options.`; req = ask || 'Dinner plus an activity'; }
    else reply = `I'm best at planning. Try something like "@Planner bowling and tacos Saturday" or "@Planner cheap ideas for Sunday".`;
  }
  const i = st.chat.indexOf(thinking); if(i>=0) st.chat.splice(i,1, {from:'planner', text:reply, req}); 
  if(S.screen==='chat') render();
}

function allPeople(){

  BASE_IDS.forEach(id=>COMMS[id].members.forEach(m=>{ if(!seen.has(m.id)){ seen.add(m.id); out.push({...m, from:S.cs[id].look.name}); } }));
  return out;
}

function qrSvg(seed){
  let x = 0; for(const ch of seed) x = (x*31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (x = (x*1103515245 + 12345) >>> 0) / 4294967296;
  const n = 25, c = 8; let cells = '';
  const finder = (r,cc) => r<7 && cc<7 || r<7 && cc>=n-7 || r>=n-7 && cc<7;
  for(let r=0;r<n;r++) for(let k=0;k<n;k++){
    let on;
    if(finder(r,k)){ const rr = r<7?r:r-(n-7), kk = k<7?k:k-(n-7); on = rr===0||rr===6||kk===0||kk===6||(rr>=2&&rr<=4&&kk>=2&&kk<=4); }
    else on = rnd() > .52;
    if(on) cells += `<rect x="${k*c}" y="${r*c}" width="${c}" height="${c}"/>`;
  }
  return `<svg viewBox="-16 -16 ${n*c+32} ${n*c+32}" width="220" height="220" role="img" aria-label="Your friend QR code"><rect x="-16" y="-16" width="${n*c+32}" height="${n*c+32}" rx="16" fill="#FFFFFF"/><g fill="#16161D">${cells}</g></svg>`;
}

function calEvents(){
  const out = [];
  Object.keys(COMMS).forEach(id=>{ const st = S.cs[id]; if(!st) return; const L = st.look, quick = !!COMMS[id].quick;
    if(st.confirmed) out.push({id, date:st.date, kind:'confirmed', title:st.confirmed.title, group:L.name, emoji:L.emoji, color:L.color, time:(st.confirmed.stops||[])[0]?.time || '', area:st.confirmed.area, quick});

/* ---------- planning engine ---------- */
function fallbackPlans(){
  const r = S.request.toLowerCase();
  const people = groupSummary();
  const capM = r.match(/\$\s?(\d+)/);
  const lowest = Math.min(...people.map(p=>p.privateBudget || 40));
  const cap = Math.min(capM ? +capM[1] : 999, lowest);
  const needHalal = people.some(p=>p.halal);
  const seed = S.round || 0;
  const count = (list, key) => { const m = {}; people.forEach(p=>(p[key]||[]).forEach(x=>{ m[x]=(m[x]||0)+1; })); return m; };
  const foodVotes = count(people,'food'), actVotes = count(people,'activities');
  const reqActs = ACT_LIST.filter(a=>a.re.test(r));
  const reqFoods = FOOD_LIST.filter(f=>r.includes(f.name.toLowerCase().split(' ')[0]));
  const V = C().look.vibes;
  const nightAsk = /night|tonight|evening|dinner/.test(r);
  const dayAsk = /daytime|brunch|morning|afternoon/.test(r);
  const outdoorAsk = /outdoor|outside|nature|sun/.test(r) || (V.includes('Outdoorsy') && !nightAsk && !/indoor/.test(r));
  const daytime = outdoorAsk || dayAsk;
  const cheapAsk = /cheap|free|budget|broke/.test(r) || V.includes('Budget-friendly');
  const nightVibe = !outdoorAsk && (V.includes('Night owls') || nightAsk);
  const foods = FOOD_LIST.filter(f=>f.meal && (!needHalal || f.halal));
  const rot = (arr, k) => arr.length ? arr.slice(k % arr.length).concat(arr.slice(0, k % arr.length)) : arr;
  const byScore = (arr, votes) => arr.slice().sort((a,b)=>(votes[b.name]||0)-(votes[a.name]||0) || a.price-b.price);
  let acts = ACT_LIST.slice();
  if(outdoorAsk) acts = acts.filter(a=>a.day);
  else if(dayAsk) acts = acts.filter(a=>a.day);
  else if(nightVibe) acts = acts.filter(a=>!a.day);
  if(V.includes('Game nights') && !outdoorAsk){ const g = ACT_GROUPS.find(x=>x[0]==='Games + competition')[1].map(x=>x[0]); acts = acts.filter(a=>g.includes(a.name)).concat(acts.filter(a=>!g.includes(a.name))); }
  const used = new Set((S.seen||[]));
  const fresh = (arr) => { const f = arr.filter(x=>!used.has(x.name)); return f.length ? f : arr; };
  const combos = [];
  const pick = (aList, fList, label, novel) => {
    for(const a of aList){ for(const f of fList){
      const price = a.price + f.price;
      if(price > cap) continue;
      if(f.day && !a.day) continue;
      if(combos.some(c=>c.a.name===a.name || c.f.name===f.name)) continue;
      combos.push({a,f,price,label,novel}); return;
    } }
  };
  const actsBest = fresh(reqActs.length ? reqActs : rot(byScore(acts, actVotes), seed));
  const foodsBest = fresh(reqFoods.length ? reqFoods.filter(f=>f.meal && (!needHalal||f.halal)) : rot(byScore(foods, foodVotes), seed));
  pick(actsBest, foodsBest.length?foodsBest:foods, 'Best match', false);
  if(reqActs.length && !combos.some(c=>reqActs.includes(c.a))){
    const a = reqActs.find(x=>x.price + 6 <= cap);
    if(a) combos.push({a, f:{name:'Snacks', price:6, halal:true, day:false, meal:true, snack:true}, price:a.price+6, label:'Best match', novel:false});
  }
  pick(rot(acts.slice().sort((a,b)=>a.price-b.price), seed), rot(foods.slice().sort((a,b)=>a.price-b.price), seed), 'Lowest cost', false);
  const novelActs = rot(acts.filter(a=>!actVotes[a.name]), seed*3+1), novelFoods = rot(foods.filter(f=>!foodVotes[f.name]), seed*2+1);
  pick(fresh(novelActs), fresh(novelFoods), 'Something new', true);
  if(cheapAsk) combos.sort((x,y)=>x.price-y.price);
  while(combos.length < 3){ pick(rot(acts, seed+combos.length*5), rot(foods, seed+combos.length*7), ['Best match','Lowest cost','Something new'][combos.length], combos.length===2); if(combos.length<3 && cap<15){ break; } }
  const n = Math.min(5, going(C().date));
  return combos.slice(0,3).map((c,i)=>{
    const A = S.area || pickArea();
    const altList = (A.alt||[]).filter(x=>x!==A.area);
    const nearFair = Object.keys(AREAS).filter(a=>a!==A.area && a!=='U District').map(fairness).sort((x,y)=>x.max-y.max)[ (seed+i) % 3 ].area;
    const hood = i===0 ? A.area : (altList[i-1] && fairness(altList[i-1]).over===0 ? altList[i-1] : nearFair);
    const day = c.a.day || c.f.day;
    const CASUAL = ['Burgers','Pizza','Fried chicken','Tacos','Food trucks','Food hall','Poke bowls','Salads + bowls'];
    const meal = day ? 'lunch' : 'dinner';
    const foodTitle = c.f.snack ? 'snacks at the venue' : c.f.name==='Brunch' ? 'brunch' : CASUAL.includes(c.f.name) ? `${c.f.name.toLowerCase()} for ${meal}` : `${c.f.name} ${meal}`;
    const stops = c.f.snack ? [{time: day?'11:00 AM':'7:00 PM', name:`[${c.a.name} venue]`, kind:`About $${c.a.price} each, snacks included`}] : day
      ? [{time:'10:30 AM', name:`[${c.a.name} spot]`, kind:c.a.price?`About $${c.a.price} each`:'Free'}, {time:'1:00 PM', name:`[${c.f.name} place]`, kind:`Table for ${n}`}]
      : [{time:'6:30 PM', name:`[${c.f.name} restaurant]`, kind:`Table for ${n}`}, {time:'8:30 PM', name:`[${c.a.name} venue]`, kind:c.a.price?`About $${c.a.price} each`:'Free'}];
    const actLow = /^[A-Z][a-z]+ [A-Z]|^(Pike|Topgolf)/.test(c.a.name) ? c.a.name : c.a.name.charAt(0).toLowerCase() + c.a.name.slice(1);
    const title = c.f.snack ? `${c.a.name} with ${foodTitle}` : day ? `${c.a.name}, then ${foodTitle}` : `${foodTitle}, then ${actLow}`;
    const reasons = [];
    const likes = (foodVotes[c.f.name]||0) + (actVotes[c.a.name]||0);
    if(c.novel) reasons.push('New for the group'); else if(likes) reasons.push(`Matches ${Math.min(likes, people.length)} people's picks`);
    reasons.push(i===1 ? 'Cheapest option' : "Under everyone's budget");
    if(needHalal) reasons.push('Halal options');
    const fz = fairness(hood);
    if(C().look.transit && AREAS[hood] && AREAS[hood][2]) reasons.unshift('Near light rail');
    else if(fz.over===0) reasons.push('Fair trip for everyone');
    reasons.splice(3);
    return {label:['Best match','Lowest cost','Something new'][i], title: title.charAt(0).toUpperCase()+title.slice(1), area:hood, perPerson:Math.max(c.price,5), stops, reasons, _names:[c.a.name, c.f.name]};
  });
}

function groupSummary(){
  const cm = CM(), mp = cm.missingPrefs || {};
  const ms = cm.members.filter(m=>m.id!==cm.missing || C().prefsIn===N());
  const people = ms.map(m=>{
    const isMissing = m.id===cm.missing;
    const E = EFF();
    const food = m.id==='mi' ? E.food : (isMissing ? mp.food : m.food);
    const acts = m.id==='mi' ? E.acts : (isMissing ? mp.acts : m.acts);
    const budget = m.id==='mi' ? E.budget : (isMissing ? mp.budget : (m.budget ?? 40));
    return {food, activities:acts, privateBudget:budget, halal: m.id==='mi' ? E.food.includes('Halal only') : m.halal, startsFrom: m.id==='mi' && !S.privacy.approx ? 'Everett (exact address shared)' : m.area};
  });
  return people;
}

async function runPlanning(isReplan){
  S.area = pickArea();
  if(!isReplan){ S.round = 0; S.seen = []; }
  const prevTitles = isReplan ? (S.plans||[]).map(p=>p.title) : [];
  clearTimers();
  if(planCtl) planCtl.abort();
  S.steps = 0; S.plans = null; S.myVote = null; S.voters = []; S.shared = false; S.animOpts = true; S.aiUsed = false; S.aiNote = '';
  go('planning');
  let aiDone = false, result = null;
  const advance = (i) => later(()=>{ if(S.screen!=='planning') return; S.steps = Math.max(S.steps, i); render(); }, i*900);
  [1,2,3,4].forEach(advance);
  const finish = () => {
    if(S.screen!=='planning' && S.screen!=='options') return;
    S.plans = result || fallbackPlans();
    S.steps = 5; render();
  };
  if(sampleFn){
    planCtl = new AbortController();
    const prompt = `You are the planning engine inside a group event app. Plan an outing for a group called ${JSON.stringify(CM().name)} in Greater Seattle.

Request typed by the organizer: ${JSON.stringify(S.request || 'Dinner plus an activity')}
Group vibe: ${JSON.stringify(C().look.vibes)}. They usually hang out: ${C().look.when}. Favorite areas: ${JSON.stringify(C().look.bases)}.
Location: center the "Best match" plan in ${S.area.area} (estimated longest trip for anyone: ${S.area.max} min${C().look.transit?' by transit':' by car'}). ${S.area.alt && S.area.alt.length ? `The other plans can use ${JSON.stringify(S.area.alt)} or nearby, as long as no one's trip gets much longer.` : 'Keep the other plans nearby too.'}${C().look.transit ? ' Most of the group takes transit: pick spots walkable from light rail or a frequent bus line, and mention that in a reason.' : ''} Use the given neighborhood names in the "area" field.
Date: ${dateLabel(C().date)}${C().quick?' (spontaneous plan, keep it simple and nearby)':', 2026'}. People going: ${going(C().date)}.
Members (budgets are private, never mention any individual's number): ${JSON.stringify(groupSummary())}

Rules:
- Every plan must cost at or under the LOWEST private budget per person, and under any dollar cap in the request.
- If anyone needs halal, every food stop must have halal options.
- Use invented, clearly fictional venue names (no real businesses). Use real Seattle-area neighborhood names.
- Draw on a wide range of ideas, not just dinner and karaoke. Restaurants can be any cuisine (for example: ${FOOD_LIST.map(f=>f.name).join(', ')}). Activities can be anything fun for a group (for example: ${ACT_LIST.map(a=>a.name).join(', ')}). Daytime plans are fine when they fit.
- Make the 3 plans clearly different from each other in both food and activity.${prevTitles.length?`
- The group already saw these and wants different ideas, so do not repeat them: ${JSON.stringify(prevTitles)}`:''}
- Return exactly 3 plans: labels "Best match", "Lowest cost", "Something new".
- Each plan: 2 stops with times. Reasons: 2 or 3 short phrases (max 5 words each) about why it fits the group. No individual budgets or names in reasons.

Return only JSON, no other text:
{"plans":[{"label":"Best match","title":"...","area":"Neighborhood","perPerson":38,"stops":[{"time":"6:30 PM","name":"...","kind":"short detail"}],"reasons":["..."]}]}`;
    try{
      const data = await sampleFn.json(prompt, {modelTier:'quick', signal:planCtl.signal});
      const plans = Array.isArray(data?.plans) ? data.plans.slice(0,3).filter(p=>p && p.title && Array.isArray(p.stops)) : [];
      if(plans.length===3){
        plans.forEach(p=>{ p.perPerson = Math.max(1, Math.round(Number(p.perPerson)||30)); });
        result = plans; S.aiUsed = true;
      } else { S.aiNote = 'Showing built-in sample plans.'; }
    }catch(e){
      if(e && e.code==='cancelled') return;
      S.aiNote = e && e.code==='not_granted' ? 'Live AI is off, so these are built-in sample plans.' : 'Live AI was unavailable, so these are built-in sample plans.';
    }
    aiDone = true;
    const wait = Math.max(0, 3700 - 0);
    later(finish, 600);
  } else {
    later(finish, 4400);
  }
}

    case 'closePlan': S.planSheet = false; render(); break;
    case 'npExplore': S.planSheet = false; S.exF = S.exF || {q:'', price:'any', when:'any', sort:'foryou'}; S.prev = [S.screen]; S.screen = 'explore'; render(); break;
    case 'npGo': { const P = S.np, idea = P.idea.trim(); S.planSheet = false;
      if(P.for==='quick'){ S.newQ = {idea: idea, when:0, deadline:1, cap:6}; S.focusName = !idea; S.np = {idea:'', for:null}; go('quick'); break; }
      S.cid = P.for; S.request = idea || defaultRequest(); S.np = {idea:'', for:null}; runPlanning(); } break;
    case 'exMore': S.exF = S.exF || {q:'', price:'any', when:'any', sort:'foryou'}; go('explore'); break;
    case 'exAsk': { const q = (S.exQ||'').trim(); S.exQ = ''; S.np = {idea:q, for:null}; S.planSheet = true; S.npAnim = true; render(); S.npAnim = false; } break;
    case 'sugNext': S.sugIdx = (S.sugIdx||0) + 1; { const sc = app.querySelector('.scroll')?.scrollTop||0; render(); const s2 = app.querySelector('.scroll'); if(s2) s2.scrollTop = sc; } break;
    case 'svClose': closeStories(); break;
    case 'svReport': clearStoryTimer(); S.svPaused = true; render(); toast('Reported. Our team reviews it, and it\'s hidden for you.'); setTimeout(()=>{ S.svPaused = false; storyStep(1); }, 900); break;
    case 'scOpen': S.sc = {type:'photo', img:null, caption:'', q:'', a:'', b:'', cid: (S.cid && COMMS[S.cid] && !COMMS[S.cid].quick) ? S.cid : 'sc'}; render(); break;
    case 'scClose': S.sc = null; render(); break;
    case 'scPost': { const C2 = S.sc, id = 's'+Date.now().toString(36), cid = C2.cid;
      let story;
      if(C2.type==='photo') story = {id, by:'mi', type:'photo', img:C2.img, caption:C2.caption.trim(), ago:'now'};
      else if(C2.type==='free') story = {id, by:'mi', type:'prompt', question:"Who's free tonight?", options:["I'm in",'Maybe',"Can't"], votes:{"I'm in":[], 'Maybe':[], "Can't":[]}, ago:'now'};
      else story = {id, by:'mi', type:'prompt', question:C2.q.trim() || 'Tacos or sushi Friday?', options:[C2.a.trim()||'Tacos', C2.b.trim()||'Sushi'], votes:{}, ago:'now'};
      if(story.type==='prompt') story.options.forEach(o=>{ story.votes[o] = story.votes[o] || []; });
      (S.stories[cid] = S.stories[cid] || []).push(story); S.seenStories.push(id); S.sc = null; render();
      const L = S.cs[cid].look; toast(`Posted to ${L.name}`);
      const others = COMMS[cid].members.filter(m=>m.id!=='mi');
      if(story.type==='prompt') others.slice(0,4).forEach((m,k)=>later(()=>{ const o = story.options[k===2 && story.options.length>2 ? 1 : 0]; story.votes[o].push(m.id); if(k===1){ toast(`${m.name} answered your story`); } if(S.sv) renderStory(); }, 1800 + k*1200));
      else if(others[0]) later(()=>{ S.cs[cid].chat.push({from:others[0].id, text:'Replied to your story: this is amazing'}); S.cs[cid].unread++; toast(`${others[0].name} replied to your story`); if(S.screen==='home') render(); }, 2500);
    } break;
    case 'calAll': S.calDay = null; render(); break;
    case 'calSync': toast('In the real app: confirmed plans sync to Google or Apple Calendar'); break;
    case 'calPlan': S.np = S.np || {idea:'', for:null}; S.planSheet = true; S.npAnim = true; S.npFocus = true; render(); S.npAnim = false; break;
    case 'newDM': S.newDM = true; render(); break;
    case 'closeNewDM': S.newDM = false; render(); break;
    case 'dmMenu': S.dmMenu = !S.dmMenu; render(); break;
    case 'dmMute': { const dd = S.dms[S.dmWith]; dd.muted = !dd.muted; S.dmMenu = false; render(); toast(dd.muted?'Muted. You won\'t get notifications from this chat.':'Unmuted'); } break;
    case 'dmPlan': {
      const fid = S.dmWith, p = personById(fid), id = 'q' + Date.now().toString(36);
      COMMS[id] = {id, name:`Hang with ${p.name}`, init:'⚡', color:'#7B3FB8', members:[MEMBERS[0], p], missing:null, quick:true};
      const st = commState(COMMS[id], 10, 0, S.defaults.budget, 'default');
      st.whenLabel = 'Tonight'; st.cap = 2; st.code = Math.random().toString(36).slice(2,7);
      st.look = {name:`Hang with ${p.name}`, emoji:'⚡', color:'#7B3FB8', pattern:'confetti', vibes:['Spontaneous'], when:'Weekend nights', bases:['Capitol Hill'], transit:false, nickname:'', anyoneEdits:false};
      st.chat = [{from:'system', text:`You started a plan with ${p.name}`}]; st.unread = 0; S.cs[id] = st;
      const dd = S.dms[fid]; dd.msgs.push({from:'planner', kind:'planCard', qid:id, text:`Started a plan for you and ${p.name}, tonight. Both of your preferences are in.`}); dd.t = ++S.tick;
      S.cid = id; S.deadline = 0; S.prev.push('dm'); S.screen = 'lobby'; render(); toast(`Plan started with ${p.name}`);
    } break;
    case 'toggleAnyone': C().look.anyoneEdits = !C().look.anyoneEdits; render(); break;
    case 'saveLook': { const st = C(); if(!st.look.name.trim()) st.look.name = COMMS[S.cid].name;
      st.chat.push({from:'system', text:`You updated the group's look and vibe`}); back('community'); toast('Community updated'); } break;
    case 'editDefaults': S.editDefaults = true; go('prefs'); break;
    case 'editProfile': toast('Editing name and photo comes in the real app'); break;
    case 'payment': toast('Payment setup comes in the real app'); break;
    case 'signout': toast('Sign out is turned off in the demo'); break;
    case 'toChat': C().unread = 0; S.screen = 'chat'; render(); break;
    case 'toPlanTab': S.screen = 'community'; render(); break;
    case 'askPlanner': { const i = document.getElementById('msg'); if(i){ if(!/^@planner/i.test(i.value)) i.value = '@Planner ' + i.value.replace(/^\s+/,''); i.focus(); } } break;
    case 'chatPlan': S.request = b.dataset.req || 'Dinner plus an activity'; runPlanning(); break;
    case 'viewPlan': S.prev=['home','community','chat']; S.screen='event'; render(); break;
    case 'nudge':
      { const st = C(), nm = missingName(), total = N(); st.nudged = true;
        st.chat.push({from:'system', text:`You nudged ${nm} to add preferences`}); render(); toast('Nudge sent to '+nm);
        later(()=>{ st.prefsIn = total; st.chat.push({from:'system', text:`${nm} added their preferences`}); if(S.screen!=='chat') st.unread++; if(S.screen==='community'||S.screen==='chat') render(); toast(nm+' added their preferences'); }, 3500); }
      break;
    case 'savePrefs': { const d = S.editDefaults; back('community'); toast(d ? 'Default preferences saved' : 'Preferences saved for '+CM().name); } break;
    case 'useDate': back('community'); toast(`Date set to ${dateLabel(C().date)}`); break;
    case 'planFromCommunity': S.request = defaultRequest(); runPlanning(); break;
    case 'cancelPlan': clearTimers(); if(planCtl) planCtl.abort(); back('home'); break;
    case 'replan':
      S.round = (S.round||0) + 1;
      S.seen = (S.seen||[]).concat((S.plans||[]).flatMap(p=>(p._names||[])));
      runPlanning(true); break;
    case 'sharePlans': {
      S.shared = true; S.animOpts = false; S.voters = S.plans.map(()=>[]);
      const st = C(), cm = CM(), dl = DL()[S.deadline][1], token = Symbol();
      S.voteRun = token;
      st.chat.push({from:'system', text:`You shared ${S.plans.length} plans. Voting closes ${dl}.`});
      st.chat.push({from:'planner', kind:'poll2'});
      render(); app.querySelector('.scroll')?.scrollTo(0,0);
      toast(`Sent to ${cm.name}. Everyone got a notification.`);
      const voters = attendees().filter(m=>m.id!=='mi');
      const weights = S.plans.map((p,i)=> 3 - i*0.8 + Math.random());
      voters.forEach((m,k)=>later(()=>{
        if(S.voteRun!==token || !S.shared) return;
        let r = Math.random()*weights.reduce((a,b)=>a+b,0), pick = 0;
        for(let j=0;j<weights.length;j++){ r -= weights[j]; if(r<=0){ pick=j; break; } }
        S.voters[pick].push(m.id);
        if(S.screen==='options' || S.screen==='chat') render();
        toast(`${m.name} voted for ${S.plans[pick].title}`);
      }, 1600 + k*1500));
    } break;
    case 'confirm': S.voteRun = null; C().confirmed = S.plans[leader()]; C().chat.push({from:'planner', kind:'confirmed'});
      if(C().quick){ C().chat.push({from:'system', text:'The split is ready in the Split tab'}); C().chat.push({from:'planner', kind:'savePrompt'}); S.prev=['home']; S.screen='chat'; S.hubTab='chat'; render(); toast('Plan locked in. Everyone got the details.'); break; }
      C().unread++; S.prev=['home','community']; S.screen='event'; render(); toast('Plan confirmed. Everyone got the details.'); break;
    case 'directions': toast('Would open Google or Apple Maps'); break;
    case 'remind': C().reminded = true; render(); toast('Reminders sent'); break;
  }
});

document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.sv){ closeStories(); return; }
  if(e.key==='Escape' && S.sc){ S.sc=null; render(); return; }
  if(e.key==='ArrowRight' && S.sv){ storyStep(1); return; } if(e.key==='ArrowLeft' && S.sv){ storyStep(-1); return; }
  if(e.key==='Escape' && (S.sheet||S.inviteSheet||S.qr||S.newDM||S.exOpen||S.planSheet)){ S.sheet=false; S.pending=null; S.inviteSheet=false; S.qr=false; S.newDM=false; S.exOpen=null; S.planSheet=false; render(); } });
render();
if(window.claude && typeof window.claude.use==='function'){
  window.claude.use('sample').then(fn=>{ sampleFn = fn; }).catch(()=>{ sampleFn = null; });
}
})();
</script>
</body>
</html>
